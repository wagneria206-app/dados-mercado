name: Atualizar dados de mercado

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19h30 de Brasília, dias úteis (depois da ANBIMA)
    - cron: "0 11 * * 1-6"    # 8h de Brasília (pega o CSV do Tesouro do dia anterior)
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null 2>&1 || echo "poppler indisponível; usando pypdf"
          pip install requests pypdf

      - name: Restaurar os dados da última coleta (ramo "site")
        run: |
          if git fetch -q --depth=1 origin site; then git restore --source=FETCH_HEAD --worktree -- data 2>/dev/null || git checkout FETCH_HEAD -- data && git reset -q; fi
          git restore --source=HEAD --worktree -- data/termos data/cri_cra_cronogramas.json data/papeis_cadastrados.json 2>/dev/null || true
      - name: Buscar dados
        run: python scripts/atualizar.py

      - name: Gravar o estado do robô no main (termos lidos e cronogramas)
        if: always()
        run: |
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Estado sem mudança."; else
            git commit -q -m "Estado do robô $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            for t in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
          fi
      - name: Publicar os dados do dia no ramo "site"
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/data
          cp -r data/. /tmp/site/data/
          cd /tmp/site
          git init -q -b site
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" site
