name: Atualizar dados de mercado

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19h30 de Brasília, dias úteis (depois da ANBIMA)
    - cron: "0 11 * * 1-6"    # 8h de Brasília (pega o CSV do Tesouro do dia anterior)
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null 2>&1 || echo "poppler indisponível; usando pypdf"
          pip install requests pypdf

      - name: Buscar dados
        run: python scripts/atualizar.py

      - name: Gravar no repositório
        if: always()
        run: |
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git push
          fi
