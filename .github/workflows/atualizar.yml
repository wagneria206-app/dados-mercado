name: Atualizar dados de mercado

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19h30 de Brasília, dias úteis (depois da ANBIMA)
    - cron: "0 11 * * 1-6"    # 8h de Brasília (pega o CSV do Tesouro do dia anterior)
  workflow_dispatch:          # botão "Run workflow" na aba Actions
    inputs:
      fontes:
        description: "Só estas fontes, separadas por vírgula (vazio = coleta completa)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null 2>&1 || echo "poppler indisponível; usando pypdf"
          pip install -q requests==2.32.3 pypdf==5.1.0

      - name: Restaurar os dados da última coleta (ramo "site")
        run: |
          if git fetch -q --depth=1 origin site; then git restore --source=FETCH_HEAD --worktree -- data 2>/dev/null || git checkout FETCH_HEAD -- data && git reset -q; fi
          # estado do robô (termos lidos, cronogramas, históricos): ramo "estado"; na primeira vez, o que está no main
          SRC=HEAD; if git fetch -q --depth=1 origin estado; then SRC=FETCH_HEAD; fi
          for p in data/termos data/cri_cra_cronogramas.json data/papeis_cadastrados.json data/curvas_hist.json; do git restore --source=$SRC --worktree -- $p 2>/dev/null || true; done
      - name: Buscar dados
        env:
          FONTES: ${{ github.event.inputs.fontes }}
        run: if [ -n "$FONTES" ]; then python scripts/atualizar.py --so "$FONTES"; else python scripts/atualizar.py; fi

      - name: Gravar o estado do robô no ramo "estado" (o main é protegido)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/estado && mkdir -p /tmp/estado/data
          for p in termos cri_cra_cronogramas.json papeis_cadastrados.json curvas_hist.json fundos_hist; do if [ -e "data/$p" ]; then cp -r "data/$p" /tmp/estado/data/; fi; done
          cd /tmp/estado
          git init -q -b estado
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Estado do robô $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" estado
      - name: Publicar os dados do dia no ramo "site"
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/data
          cp -r data/. /tmp/site/data/
          cd /tmp/site
          git init -q -b site
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" site
      - name: Avisar falha (issue no GitHub)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[0].number' 2>/dev/null || true)
          MSG="A execução de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body "$MSG"; else gh issue create -R "${{ github.repository }}" --title "$T" --body "$MSG

          O app continua mostrando os últimos dados publicados. Este aviso fecha sozinho quando o robô voltar a rodar sem erro."; fi
      - name: Fechar aviso de falha anterior
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[].number' 2>/dev/null); do gh issue close "$N" -R "${{ github.repository }}" --comment "Voltou a funcionar em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')."; done
