name: Atualizar Bolsa americana (SEC, Cboe, Nasdaq e Tesouro dos EUA)

on:
  schedule:
    - cron: "25 22 * * 1-5"    # 19h25 de Brasília, depois do fechamento em Nova York
    - cron: "45 10 * * 2-6"    # 7h45 de Brasília (completa o que saiu tarde)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-eua
  cancel-in-progress: false

jobs:
  eua:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Restaurar a última publicação (ramo "eua")
        run: |
          mkdir -p /tmp/ent /tmp/sai
          if git fetch -q --depth=1 origin eua; then git --work-tree=/tmp/ent checkout FETCH_HEAD -- . && git reset -q; fi
          ls /tmp/ent | head
      - name: Coletar
        run: python scripts/eua.py /tmp/ent /tmp/sai
      - name: Publicar no ramo "eua"
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/sai
          du -sh . ; ls s | wc -l
          git init -q -b eua
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bolsa americana de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" eua
      - name: Avisar falha (issue no GitHub)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[0].number' 2>/dev/null || true)
          MSG="A execução de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body "$MSG"; else gh issue create -R "${{ github.repository }}" --title "$T" --body "$MSG

          O app continua mostrando os últimos dados publicados. Este aviso fecha sozinho quando o robô voltar a rodar sem erro."; fi
      - name: Fechar aviso de falha anterior
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[].number' 2>/dev/null); do gh issue close "$N" -R "${{ github.repository }}" --comment "Voltou a funcionar em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')."; done
