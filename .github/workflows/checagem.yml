name: Checagem do app

# Abre o app num navegador sem tela, com os dados reais, e percorre todas as abas.
# Roda em todo pull request (exigida pela proteção do main), em mudanças do app no main e uma vez por dia.
on:
  pull_request:   # em todo pull request: a checagem é obrigatória para entrar no main
  push:
    branches: [main]
    paths: ["index.html", "app/**", "sw.js", "manifest.webmanifest", "tests/**", "scripts/eua.py", "scripts/macro.py"]
  schedule:
    - cron: "23 13 * * 1-6"     # 10h23 de Brasília, depois das coletas da manhã
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: O index.html confere com os módulos em app/
        run: python app/build.py --check
      - name: Instalar navegador
        run: |
          pip install -q playwright==1.48.0 requests==2.32.3
          python -m playwright install --with-deps chromium
      - name: Cálculos dos robôs (casos conhecidos)
        run: python -u tests/robos.py
      - name: Contratos dos dados (campos que o app usa em cada arquivo dos robôs)
        run: python -u tests/contratos.py
      - name: Números do app (casos conhecidos e preços publicados do Tesouro)
        run: python -u tests/numeros.py index.html
      - name: Percorrer todas as abas
        run: python -u tests/checagem.py index.html
      - name: Fotografar as telas (tablet, temas claro e escuro)
        if: always()
        continue-on-error: true
        run: python -u tests/telas.py index.html telas
      - name: Guardar as fotos das telas
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: telas
          path: telas/
          retention-days: 14
      - name: Avisar falha (issue no GitHub)
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[0].number' 2>/dev/null || true)
          MSG="A checagem de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') encontrou problema no app: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body "$MSG"; else gh issue create -R "${{ github.repository }}" --title "$T" --body "$MSG

          Este aviso fecha sozinho quando a checagem voltar a passar."; fi
      - name: Fechar aviso de falha anterior
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[].number' 2>/dev/null); do gh issue close "$N" -R "${{ github.repository }}" --comment "Voltou a passar em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')."; done
