name: Tesouro Direto a cada 30 minutos

on:
  schedule:
    - cron: "5,35 12-21 * * 1-5"   # 9h05 às 18h35 de Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados          # mesma fila da coleta completa: nunca gravam ao mesmo tempo
  cancel-in-progress: false

jobs:
  td:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Buscar e gravar (com nova tentativa se o repositório mudou)
        run: |
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main
            python scripts/atualizar.py --rapido
            git add data/mercado.json data/td_intradiario.json data/td_historico.json data/status.json
            if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
            git commit -q -m "Tesouro Direto $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push recusado (tentativa $tentativa); recomeçando sobre a versão mais nova."
            sleep 10
          done
          exit 1
