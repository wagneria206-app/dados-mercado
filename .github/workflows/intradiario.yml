name: Tesouro Direto a cada 30 minutos

on:
  schedule:
    - cron: "5,35 12-21 * * 1-5"   # 9h05 às 18h35 de Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados          # mesma fila da coleta completa: nunca gravam ao mesmo tempo
  cancel-in-progress: false

jobs:
  td:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Restaurar os dados da última coleta (ramo "site")
        run: |
          if git fetch -q --depth=1 origin site; then git restore --source=FETCH_HEAD --worktree -- data 2>/dev/null || git checkout FETCH_HEAD -- data && git reset -q; fi
          git restore --source=HEAD --worktree -- data/termos data/cri_cra_cronogramas.json data/papeis_cadastrados.json 2>/dev/null || true
      - name: Buscar Tesouro Direto
        run: python scripts/atualizar.py --rapido
      - name: Publicar os dados do dia no ramo "site"
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/data
          cp -r data/. /tmp/site/data/
          cd /tmp/site
          git init -q -b site
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" site
