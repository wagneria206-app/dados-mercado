name: Atualizar fundos (CVM)

on:
  schedule:
    - cron: "17 11 * * *"     # 8h17 de Brasília
    - cron: "47 23 * * 1-5"   # 20h47 de Brasília
  workflow_dispatch:
    inputs:
      minutos:
        description: "Tempo máximo de coleta (min)"
        required: false
        default: "38"
      cda:
        description: "Refazer as carteiras (1 = sim)"
        required: false
        default: "0"
      refazer:
        description: "Reconstruir a cota diária do zero (1 = sim)"
        required: false
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-fundos
  cancel-in-progress: false

jobs:
  fundos:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Restaurar a última publicação (ramo "fundos")
        run: |
          mkdir -p /tmp/ent /tmp/sai
          if git fetch -q --depth=1 origin fundos; then git --work-tree=/tmp/ent checkout FETCH_HEAD -- . && git reset -q; fi
          ls /tmp/ent | head
      - name: Coletar
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '38' }}
          CDA: ${{ github.event.inputs.cda || '0' }}
          REFAZER: ${{ github.event.inputs.refazer || '0' }}
        run: python scripts/fundos.py /tmp/ent /tmp/sai
      - name: Publicar no ramo "fundos"
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/sai
          du -sh . ; ls f | wc -l
          git init -q -b fundos
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fundos de $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" fundos
      - name: Avisar falha (issue no GitHub)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[0].number' 2>/dev/null || true)
          MSG="A execução de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body "$MSG"; else gh issue create -R "${{ github.repository }}" --title "$T" --body "$MSG

          O app continua mostrando os últimos dados publicados. Este aviso fecha sozinho quando o robô voltar a rodar sem erro."; fi
      - name: Fechar aviso de falha anterior
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha no robô: ${{ github.workflow }}"
          for N in $(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$T\"" --json number --jq '.[].number' 2>/dev/null); do gh issue close "$N" -R "${{ github.repository }}" --comment "Voltou a funcionar em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')."; done
