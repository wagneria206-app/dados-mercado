name: sonda
on: {push: {branches: ["sonda6"]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - run: python3 sonda.py || true
      - run: |
          git config user.name robo; git config user.email robo@users.noreply.github.com
          git checkout --orphan sonda-out; git rm -rqf --cached .; git add -f sonda.txt; git commit -qm sonda; git push -f origin sonda-out
