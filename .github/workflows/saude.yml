name: Saúde das fontes

on:
  schedule:
    - cron: "41 */3 * * *"     # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: saude
  cancel-in-progress: false

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Buscar o estado publicado por cada robô
        run: |
          for b in site ativos fundos eua macro saude; do git fetch -q --depth=1 origin "$b:refs/remotes/origin/$b" || echo "sem o ramo $b"; done
      - name: Montar o painel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/saude.py /tmp/sai
      - name: Publicar no ramo "saude"
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/sai
          git init -q -b saude
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Saúde das fontes $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" saude
