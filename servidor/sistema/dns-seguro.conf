# DNS criptografado (DNS over TLS): os endereços que o servidor procura não podem ser lidos nem trocados no caminho.
# Quad9 (bloqueia domínios de golpes e vírus) e, como reserva, Cloudflare.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
Domains=~.
LLMNR=no
MulticastDNS=no
